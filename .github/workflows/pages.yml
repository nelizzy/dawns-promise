name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read     # changelog: look up the last successful deploy
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: Bases' file.ctime / file.mtime come from git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Install
        run: npm ci
        working-directory: .site
      - name: Test
        run: npm test
        working-directory: .site
      - name: Build
        run: node build.mjs
        working-directory: .site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site/dist

      # ---- changelog: diff published notes since the last successful deploy ----
      - name: Find last deployed commit
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=1" \
                --jq '.workflow_runs[0].head_sha // empty')
          if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "No previous deploy found – skipping changelog."
          fi
      - name: Generate changelog
        id: changelog
        if: steps.since.outputs.sha != '' && steps.since.outputs.sha != github.sha
        working-directory: .site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          AVATAR_URL: https://cdn.discordapp.com/emojis/1534434066873454653.webp?size=100
        run: |
          node scripts/changelog.mjs ${{ steps.since.outputs.sha }} ${{ github.sha }} --out "$RUNNER_TEMP/changelog.json"
          [ -f "$RUNNER_TEMP/changelog.json" ] && echo "has=true" >> "$GITHUB_OUTPUT" || true
      - name: Upload changelog
        if: steps.changelog.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog.json
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-discord:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && !contains(github.event.head_commit.message, '[no changelog]') }}
    runs-on: ubuntu-latest
    continue-on-error: true   # a Discord hiccup shouldn't mark the deploy as failed
    steps:
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true   # no artifact = nothing changed
        with:
          name: changelog
      - name: Post changelog to Discord
        if: steps.dl.outcome == 'success'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 <<'PYEOF'
          import os, urllib.request, urllib.error
          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=open("changelog.json", "rb").read(),
              headers={"Content-Type": "application/json",
                       "User-Agent": "Mozilla/5.0 (compatible; DawnsPromiseChangelog/1.0)"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord webhook responded with status {resp.status}")
          except urllib.error.HTTPError as err:
              print(f"Discord webhook error {err.code}: {err.read().decode('utf-8', 'replace')}")
              raise
          PYEOF
